<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pratham Ratish Yadav | Portfolio</title>

    <meta
        name="description"
        content="Pratham Ratish Yadav — Personal Portfolio">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Portfolio CSS -->
    <link
        rel="stylesheet"
        href="portfolio.css">

</head>


<body>


    <!-- =====================================================
         PORTFOLIO PAGE
    ====================================================== -->

    <main class="portfolio-page">


<!-- =================================================
     CINEMATIC OPENING ANIMATION
================================================= -->

<div class="portfolio-opening" id="portfolioOpening">

    <div class="opening-bg"></div>

    <div class="opening-center">

        <div class="opening-overline">
            PERSONAL PORTFOLIO
        </div>

        <div class="opening-name">
            PRATHAM RATISH YADAV
        </div>

        <div class="opening-title">
            PORTFOLIO
        </div>

        <div class="opening-line">
            <span></span>
        </div>

    </div>

    <div class="opening-corner opening-corner-left">
        CREATIVE • ENGINEERING
    </div>

    <div class="opening-corner opening-corner-right">
        2026
    </div>

</div>




        <!-- =================================================
             TOP HEADER
        ================================================== -->

        <header class="portfolio-top">


            <!-- PROFILE + NAME -->

            <a
                href="portfolio.html"
                class="portfolio-brand"
                aria-label="Pratham Ratish Yadav Portfolio Home">


                <span class="portfolio-profile">

                    <img
                        src="images/profile.jpg"
                        alt="Pratham Ratish Yadav">

                </span>


                <span class="portfolio-name">
                    PRATHAM RATISH YADAV
                </span>


            </a>



            <!-- HEADER RIGHT -->

            <span class="portfolio-type">
                PORTFOLIO
            </span>


        </header>



        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <section class="portfolio-landing">


            <!-- =================================================
                 LEFT CONTENT
            ================================================== -->

            <div class="portfolio-content">


                <span class="portfolio-label">
                    WELCOME TO MY
                </span>


                <h1>

                    MY

                    <span>
                        PORTFOLIO
                    </span>

                </h1>


                <p class="portfolio-description">

                    A digital space built around my creativity,
                    skills, projects and journey.

                </p>


                <!-- EXPLORE BUTTON -->

                <a
                    href="index.html"
                    class="portfolio-btn"
                    aria-label="Explore Pratham Ratish Yadav Portfolio">


                    <span>
                        Explore Portfolio
                    </span>


                    <span
                        class="portfolio-btn-arrow"
                        aria-hidden="true">

                        ↗

                    </span>


                </a>


            </div>



            <!-- =================================================
                 RIGHT IMAGE
            ================================================== -->

            <div class="portfolio-image-wrapper">


                <div class="portfolio-image">


                    <img
                        src="images/portfolio/portfolio-main.jpg"
                        alt="Pratham Ratish Yadav"
                        loading="eager">


                </div>



                <!-- IMAGE INFORMATION -->

                <div class="portfolio-image-info">


                    <span>
                        CREATIVE
                    </span>


                    <span>
                        ENGINEERING
                    </span>


                    <span>
                        JOURNEY
                    </span>


                </div>


            </div>


        </section>



        <!-- =================================================
             BOTTOM INFORMATION
        ================================================== -->

        <footer class="portfolio-bottom">


            <span>
                CREATIVE • EDITOR • TUTOR
            </span>


            <span>
                © 2026
            </span>


        </footer>


    </main>


</body>

</html>
